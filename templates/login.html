{% extends "base.html" %} {% block content %}
<div class="row justify-content-center gap-4 mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm h-100">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 lang-en">Customer Login</h3>
        <h3 class="text-center mb-4 lang-fr d-none">Connexion Client</h3>

        <form action="/login" method="POST">
          <div class="mb-3">
            <label class="form-label lang-en">Email</label>
            <label class="form-label lang-fr d-none">Courriel</label>
            <input type="email" name="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label lang-en">Membership Number</label>
            <label class="form-label lang-fr d-none">Numéro de Membre</label>
            <input
              type="text"
              name="membership_num"
              class="form-control"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <span class="lang-en">Log In</span>
            <span class="lang-fr d-none">Se Connecter</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card shadow-sm h-100 bg-body">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 lang-en">Create Account</h3>
        <h3 class="text-center mb-4 lang-fr d-none">Créer un Compte</h3>

        <form action="/signup" method="POST">
          <div class="mb-3">
            <label class="form-label lang-en">Full Name</label>
            <label class="form-label lang-fr d-none">Nom Complet</label>
            <input type="text" name="name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label lang-en">Email</label>
            <label class="form-label lang-fr d-none">Courriel</label>
            <input type="email" name="email" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-outline-success w-100 mt-2">
            <span class="lang-en">Sign Up</span>
            <span class="lang-fr d-none">S'inscrire</span>
          </button>
          <p class="text-muted small text-center mt-3 lang-en">
            A membership number will be generated for you.
          </p>
          <p class="text-muted small text-center mt-3 lang-fr d-none">
            Un numéro de membre sera généré pour vous.
          </p>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
